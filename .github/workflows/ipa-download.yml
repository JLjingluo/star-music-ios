name: Direct IPA Download
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '成功的 iOS 构建 Run ID'
        required: true
        type: string
        default: '38422764650'
permissions:
  contents: write
  actions: read
concurrency:
  group: ipa-download-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Validate source build and preserve private access
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO" --jq '.private')" != true ]; then
            printf 'This workflow expects an owner-private repository.\n' >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')" != success ]; then
            printf 'The selected source build must be successful.\n' >&2
            exit 1
          fi
          SOURCE_SHA=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')
          printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Retrieve the compiled IPA
        uses: actions/download-artifact@v4
        with:
          name: StarMusic-iOS-Unsigned
          path: delivery
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify actual IPA contents
        run: |
          python3 - <<'PY'
          import zipfile,plistlib,struct,hashlib
          from pathlib import Path
          p=Path('delivery/StarMusic-Unsigned.ipa')
          with zipfile.ZipFile(p) as z:
              info=plistlib.loads(z.read('Payload/StarMusic.app/Info.plist'))
              assert info['CFBundleIdentifier']=='music.star.starmusic'
              assert info['CFBundlePackageType']=='APPL'
              binary=z.read('Payload/StarMusic.app/'+info['CFBundleExecutable'])
              magic,cpu=struct.unpack_from('<II',binary)
              assert magic==0xfeedfacf and cpu==0x0100000c, 'Expected an arm64 device binary'
              assert info['DTPlatformName'].lower() == 'iphoneos', 'Expected a device build'
          Path('IPA-CHECKSUM.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  StarMusic-Unsigned.ipa\n')
          print('Verified genuine arm64 iPhone IPA payload.')
          PY
      - name: Attach the IPA directly to a private repository release
        shell: bash
        run: |
          set -euo pipefail
          TAG="ios-v0.3.0-unsigned-build-$SOURCE_RUN_ID"
          cat > RELEASE-NOTES.md <<'NOTES'
          原生 Star Music iOS v0.3 第一阶段。
          
          下载 StarMusic-Unsigned.ipa 即可获取应用包，没有额外的 ZIP 包装。
          此包尚未签名，安装到 iPhone 前需要有效的 Apple 签名。
          原始云端构建通过 9 项 XCTest；录音及系统音频中断行为仍需实机验证。
          仓库保持私有，下载需要有访问权限的 GitHub 登录。
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" delivery/StarMusic-Unsigned.ipa IPA-CHECKSUM.txt --clobber
          else
            gh release create "$TAG" delivery/StarMusic-Unsigned.ipa IPA-CHECKSUM.txt --target "$SOURCE_SHA" --title 'Star Music iOS v0.3 · Unsigned IPA' --notes-file RELEASE-NOTES.md
          fi
          gh release view "$TAG" --json url,assets

name: StarMusic
options:
  bundleIdPrefix: music.star
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.6.0'
    CURRENT_PROJECT_VERSION: '7'
    DEVELOPMENT_TEAM: ''
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
targets:
  StarMusic:
    type: application
    platform: iOS
    sources:
      - path: StarMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: music.star.starmusic
        INFOPLIST_FILE: StarMusic/Info.plist
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': StarMusic/Simulator.entitlements
        'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    scheme:
      testTargets:
        - StarMusicTests
        - StarMusicUITests
  StarMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StarMusicTests
    dependencies:
      - target: StarMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: music.star.starmusic.tests

  StarMusicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StarMusicUITests
    dependencies:
      - target: StarMusic
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: music.star.starmusic.uitests
